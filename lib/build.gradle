// Maven发布配置
publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.release
            }

            groupId = 'com.thirdlib'
            artifactId = 'thirdpartylib'
            version = '1.0.0'

            pom {
                name = 'thirdpartylib'
                description = 'Android C++ Thirdparty Library with Prefab support'
                url = 'https://github.com/example/thirdpartylib'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'developer'
                        name = 'Developer'
                        email = 'developer@example.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            // 本地Maven仓库路径
            url = uri("${rootDir}/local-maven-repo")
        }
    }
}

