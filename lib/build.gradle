plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.thirdlib.thirdpartylib'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        ndkVersion rootProject.ext.ndkVersion

        ndk {
            abiFilters 'arm64-v8a'
            //stl "c++_static"
        }

        externalNativeBuild {
            cmake {
                cppFlags '-v'
                arguments "-DANDROID_STL=c++_shared"
                arguments("-DCMAKE_TOOLCHAIN_FILE=conan_android_toolchain.cmake")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    publishing {
        singleVariant("release")
    }
}

// arch映射：AGP ABI -> Conan arch
ext.abiToConanArch = [
    'arm64-v8a': 'armv8',
    'armeabi-v7a': 'armv7',
    'x86_64': 'x86_64',
    'x86': 'x86'
]

// 存储include目录的全局Map：key=组件名, value=路径列表
ext.conanIncludeDirsMap = [:]

// 方法1：执行conan install
def executeConanInstall(String build_type, String arch) {
    def conanExecutable = "conan"
    def cmd = conanExecutable + " install " +
              ". --profile android.profile -s build_type=" + build_type + " -s arch=" + arch +
              " --build missing -c tools.cmake.cmake_layout:build_folder_vars=['settings.arch']"
    print(">> ${cmd} \n")

    def sout = new StringBuilder(), serr = new StringBuilder()
    def proc = cmd.execute(null, projectDir)
    proc.consumeProcessOutput(sout, serr)
    proc.waitFor()
    println "$sout $serr"
    if (proc.exitValue() != 0) {
        throw new Exception("out> $sout err> $serr" + "\nCommand: ${cmd}")
    }
}

// 方法2：执行conan graph info并收集include目录
def collectIncludeDirs(String build_type, String arch) {
    def cmd = "conan graph info . --profile android.profile " +
              "-s build_type=${build_type} -s arch=${arch} --format=json"
    println ">> ${cmd}"

    def sout = new StringBuilder(), serr = new StringBuilder()
    def proc = cmd.execute(null, projectDir)
    proc.consumeProcessOutput(sout, serr)
    proc.waitFor()

    if (proc.exitValue() != 0) {
        throw new Exception("conan graph info failed: ${serr}")
    }

    // 解析JSON
    def jsonSlurper = new groovy.json.JsonSlurper()
    def graphInfo = jsonSlurper.parseText(sout.toString())
    def nodes = graphInfo.graph.nodes

    // 遍历节点，找到有package_id的非CLI节点
    nodes.each { id, node ->
        def packageId = node.package_id
        def recipe = node.recipe

        // 跳过CLI节点（recipe为Cli或Consumer）
        if (packageId && recipe != 'Cli' && recipe != 'Consumer') {
            def ref = node.ref.split('#')[0]  // 去掉revision，如 "zlib/1.3.1#xxx" -> "zlib/1.3.1"
            def packageName = ref.split('/')[0].toLowerCase()  // 提取包名，如 "zlib"

            // 使用conan cache path获取包路径
            def cacheCmd = "conan cache path ${ref}:${packageId}"
            println ">> ${cacheCmd}"

            def cacheSout = new StringBuilder(), cacheSerr = new StringBuilder()
            def cacheProc = cacheCmd.execute(null, projectDir)
            cacheProc.consumeProcessOutput(cacheSout, cacheSerr)
            cacheProc.waitFor()

            if (cacheProc.exitValue() == 0) {
                def packageFolder = cacheSout.toString().trim()

                // 从cpp_info.root.includedirs获取相对路径
                def includedirs = node.cpp_info?.root?.includedirs
                if (includedirs) {
                    def includeDirs = []
                    includedirs.each { relativePath ->
                        def includeDir = new File(packageFolder, relativePath)
                        if (includeDir.exists()) {
                            includeDirs << includeDir.absolutePath
                            println ">> Found include dir for ${packageName}: ${includeDir.absolutePath}"
                        }
                    }
                    if (includeDirs) {
                        conanIncludeDirsMap[packageName] = includeDirs
                    }
                }
            }
        }
    }
}

task conanInstall {
    // 从AGP配置读取abiFilters，默认['arm64-v8a']
    def abiFilters = android.defaultConfig.ndk.abiFilters ?: ['arm64-v8a']

    doLast {
        ["Debug", "Release", "RelWithDebInfo"].each { String buildType ->
            abiFilters.each { String abi ->
                def arch = abiToConanArch[abi]
                if (!arch) {
                    throw new Exception("Unknown ABI: ${abi}")
                }

                executeConanInstall(buildType, arch)

                // 只在第一个ABI时收集include目录（避免重复）
                if (abi == abiFilters[0]) {
                    collectIncludeDirs(buildType, arch)
                }
            }
        }
        // 打印最终结果
        println ">> Collected include directories:"
        conanIncludeDirsMap.each { packageName, dirs ->
            println ">>   ${packageName}:"
            dirs.each { println ">>     ${it}" }
        }

        // 将收集到的头文件复制到 .cxx/headers 目录
        def headersDir = new File(projectDir, ".cxx/include")
        headersDir.mkdirs()

        conanIncludeDirsMap.each { packageName, dirs ->
            dirs.each { includePath ->
                def srcDir = new File(includePath)
                def destDir = new File(headersDir, packageName)
                copy {
                    from srcDir
                    into destDir
                    include '**/*.h'
                }
            }
        }

        // 拷贝项目自身的头文件到 include 根目录
        def ownHeadersDir = new File(projectDir, "src/main/cpp/include")
        if (ownHeadersDir.exists()) {
            copy {
                from ownHeadersDir
                into headersDir
                include '**/*.h'
            }
        }

        println ">> Headers copied to: ${headersDir.absolutePath}"
    }
}

tasks.named("preBuild").configure {
    dependsOn("conanInstall")
}

// ============================================================
// 手动Prefab相关配置
// ============================================================

// 存储conan包的package folder路径
ext.conanPackageFoldersMap = [:]

// 从conan graph info收集package folder路径
def collectPackageFolders(String build_type, String arch) {
    def cmd = "conan graph info . --profile android.profile " +
              "-s build_type=${build_type} -s arch=${arch} --format=json"
    println ">> collectPackageFolders: ${cmd}"

    def sout = new StringBuilder(), serr = new StringBuilder()
    def proc = cmd.execute(null, projectDir)
    proc.consumeProcessOutput(sout, serr)
    proc.waitFor()

    if (proc.exitValue() != 0) {
        throw new Exception("conan graph info failed: ${serr}")
    }

    def jsonSlurper = new groovy.json.JsonSlurper()
    def graphInfo = jsonSlurper.parseText(sout.toString())
    def nodes = graphInfo.graph.nodes

    nodes.each { id, node ->
        def packageId = node.package_id
        def recipe = node.recipe

        if (packageId && recipe != 'Cli' && recipe != 'Consumer') {
            def ref = node.ref.split('#')[0]
            def packageName = ref.split('/')[0].toLowerCase()

            // 使用conan cache path获取包路径
            def cacheCmd = "conan cache path ${ref}:${packageId}"
            def cacheSout = new StringBuilder(), cacheSerr = new StringBuilder()
            def cacheProc = cacheCmd.execute(null, projectDir)
            cacheProc.consumeProcessOutput(cacheSout, cacheSerr)
            cacheProc.waitFor()

            if (cacheProc.exitValue() == 0) {
                def packageFolder = cacheSout.toString().trim()
                conanPackageFoldersMap[packageName] = packageFolder
                println ">> Package folder for ${packageName}: ${packageFolder}"
            }
        }
    }
}

// 在conanInstall中收集package folders
// 在原始conanInstall task之后添加收集逻辑
def conanInstallTask = tasks.getByName('conanInstall')
conanInstallTask.finalizedBy tasks.register('collectPackageFoldersTask') {
    doLast {
        ["Release"].each { buildType ->
            ["arm64-v8a"].each { abi ->
                def arch = abiToConanArch[abi]
                collectPackageFolders(buildType, arch)
            }
        }
    }
}

// 生成prefab.json (Prefab Package 2 格式)
def generatePrefabJson(def buildDir) {
    def prefabJson = new File(buildDir, "prefab.json")
    // schema_version必须是2（AGP 8.x使用V2），添加version字段
    // dependencies为空数组，因为zlib等依赖已作为内部模块集成
    def version = project.hasProperty('libraryVersion') ? libraryVersion : '1.0.0'
    prefabJson.text = """
{
    "schema_version": 2,
    "name": "thirdpartylib",
    "version": "${version}",
    "dependencies": []
}
"""
    return prefabJson
}

// 删除generateModulesJson函数（Prefab 2不需要modules.json）

// 生成thirdpartylib/module.json (Prefab Module 2 格式)
def generateModuleJson(def moduleDir, String libraryName, List<String> exportLibraries) {
    def moduleJson = new File(moduleDir, "module.json")
    def exportLibrariesJson = exportLibraries ? "\"export_libraries\": ${groovy.json.JsonOutput.toJson(exportLibraries)}," : ""
    moduleJson.text = """
{
    ${exportLibrariesJson}
    "library_name": "${libraryName}"
}
"""
    return moduleJson
}

// 生成libs/android.<abi>/abi.json (Prefab ABI 2 格式)
def generateAbiJson(def libDir, String abi, int api, int ndkMajor, String stl, boolean isStatic) {
    def abiJson = new File(libDir, "abi.json")
    abiJson.text = """
{
    "abi": "${abi}",
    "api": ${api},
    "ndk": ${ndkMajor},
    "stl": "${stl}",
    "static": ${isStatic}
}
"""
    return abiJson
}

// 查找库文件
def findLibraryFile(def buildDir, String abi, String libName) {
    // 搜索所有可能的variant目录
    def searchPaths = [
        new File(buildDir, "intermediates/cmake/release/obj/${abi}"),
        new File(buildDir, "intermediates/cmake/RelWithDebInfo/obj/${abi}"),
        new File(buildDir, "intermediates/cmake/Debug/obj/${abi}"),
        new File(buildDir, "intermediates/cxx/"),
    ]

    for (def path : searchPaths) {
        if (path.exists()) {
            def result = findFileRecursively(path, libName)
            if (result) {
                return result
            }
        }
    }
    return null
}

def findFileRecursively(File dir, String fileName) {
    if (!dir.exists() || !dir.isDirectory()) return null

    def children = dir.listFiles()
    if (children == null) return null

    for (File child : children) {
        if (child.name == fileName) {
            return child
        }
        if (child.isDirectory()) {
            def result = findFileRecursively(child, fileName)
            if (result) return result
        }
    }
    return null
}

// 自定义Task: assemblePrefab
task assemblePrefab {
    group = "build"
    description = "Assemble prefab directory structure for AAR (Prefab 2 format)"

    dependsOn 'conanInstall'
    dependsOn 'collectPackageFoldersTask'
    dependsOn 'externalNativeBuildRelease'  // 确保CMake构建完成

    doLast {
        def variant = "Release"
        def abi = "arm64-v8a"

        // 构建输出目录
        def buildDir = layout.buildDirectory.get().asFile
        def prefabDir = new File(buildDir, "intermediates/prefab/${variant}")
        def modulesDir = new File(prefabDir, "modules")

        // 创建Prefab模块目录
        def thirdpartyModuleDir = new File(modulesDir, "thirdpartylib")
        def zlibModuleDir = new File(modulesDir, "zlib")

        // 创建目录结构
        prefabDir.mkdirs()
        modulesDir.mkdirs()
        thirdpartyModuleDir.mkdirs()
        zlibModuleDir.mkdirs()

        println ">> assemblePrefab: prefabDir=${prefabDir}"

        // ==================== thirdpartylib 模块 ====================
        // 1. 复制libthirdpartylib.so到模块的libs目录
        def thirdpartyLibSo = findLibraryFile(buildDir, abi, "libthirdpartylib.so")
        if (thirdpartyLibSo) {
            def libDir = new File(thirdpartyModuleDir, "libs/android.${abi}")
            libDir.mkdirs()
            copy {
                from thirdpartyLibSo
                into libDir
            }
            println ">> Copied libthirdpartylib.so to Prefab libs: ${libDir}"
        } else {
            println ">> Warning: libthirdpartylib.so not found"
        }

        // 2. 复制lib自己的头文件到thirdpartylib/include
        def ownHeadersSrc = new File(projectDir, "src/main/cpp/include")
        def ownHeadersDest = new File(thirdpartyModuleDir, "include")
        if (ownHeadersSrc.exists()) {
            ownHeadersDest.mkdirs()
            copy {
                from ownHeadersSrc
                into ownHeadersDest
                include '**/*.h'
            }
            println ">> Copied own headers to ${ownHeadersDest}"
        }

        // 3. 生成thirdpartylib/module.json
        generateModuleJson(thirdpartyModuleDir, "thirdpartylib", [":zlib"])

        // 4. 生成thirdpartylib/abi.json
        def thirdpartyLibDir = new File(thirdpartyModuleDir, "libs/android.${abi}")
        if (thirdpartyLibDir.exists()) {
            def minSdk = android.defaultConfig.minSdk ?: 21
            def ndkVersion = project.hasProperty('ndkVersion') ? ndkVersion : "25.1.8937393"
            def ndkMajor = ndkVersion.split('\\.')[0].toInteger()
            def stl = "c++_shared"

            def libFile = thirdpartyLibDir.listFiles().find { it.name.endsWith('.so') || it.name.endsWith('.a') }
            def isStatic = libFile?.name?.endsWith('.a') ?: false

            generateAbiJson(thirdpartyLibDir, abi, minSdk, ndkMajor, stl, isStatic)
            println ">> Generated abi.json for thirdpartylib"
        }

        // ==================== zlib 模块（作为内部模块） ====================
        // 5. 从conan包复制zlib头文件
        def zlibPackageFolder = conanPackageFoldersMap['zlib']
        if (zlibPackageFolder) {
            def zlibIncludeSrc = new File(zlibPackageFolder, "include")
            def zlibIncludeDest = new File(zlibModuleDir, "include")
            if (zlibIncludeSrc.exists()) {
                zlibIncludeDest.mkdirs()
                copy {
                    from zlibIncludeSrc
                    into zlibIncludeDest
                    include '**/*.h'
                }
                println ">> Copied zlib headers to ${zlibIncludeDest}"
            }

            // 6. 复制zlib.so到Prefab libs目录
            def zlibSoSrc = new File(zlibPackageFolder, "lib")
            if (zlibSoSrc.exists()) {
                def zlibSoFile = new File(zlibSoSrc, "libz.so")
                if (zlibSoFile.exists()) {
                    def zlibLibDir = new File(zlibModuleDir, "libs/android.${abi}")
                    zlibLibDir.mkdirs()
                    copy {
                        from zlibSoFile
                        into zlibLibDir
                    }
                    println ">> Copied libz.so to Prefab libs: ${zlibLibDir}"
                }
            }
        } else {
            println ">> Warning: zlib package folder not found"
        }

        // 7. 生成zlib/module.json
        generateModuleJson(zlibModuleDir, "z", [])

        // 8. 生成zlib/abi.json
        def zlibLibDir = new File(zlibModuleDir, "libs/android.${abi}")
        if (zlibLibDir.exists()) {
            def minSdk = android.defaultConfig.minSdk ?: 21
            def ndkVersion = project.hasProperty('ndkVersion') ? ndkVersion : "25.1.8937393"
            def ndkMajor = ndkVersion.split('\\.')[0].toInteger()
            def stl = "c++_shared"

            def libFile = zlibLibDir.listFiles().find { it.name.endsWith('.so') || it.name.endsWith('.a') }
            def isStatic = libFile?.name?.endsWith('.a') ?: false

            generateAbiJson(zlibLibDir, abi, minSdk, ndkMajor, stl, isStatic)
            println ">> Generated abi.json for zlib"
        }

        // ==================== 生成prefab.json ====================
        generatePrefabJson(prefabDir)

        println ">> Prefab assembled at: ${prefabDir.absolutePath}"
        println ">> Prefab structure:"
        prefabDir.eachFileRecurse { file ->
            if (file.isFile()) {
                println ">>   ${file.absolutePath.replace(prefabDir.absolutePath + '/', '')}"
            }
        }
    }
}

// 拦截AAR打包，注入prefab目录
afterEvaluate {
    // AGP 8.x 使用 bundleReleaseAar 任务名，创建的是zip文件
    def packageTask = tasks.find { it.name == 'bundleReleaseAar' }
    if (packageTask) {
        packageTask.dependsOn assemblePrefab

        packageTask.doLast {
            // bundleReleaseAar 创建的是zip文件
            def aarFile = new File(buildDir, "outputs/aar/lib-release.aar")
            def prefabDir = layout.buildDirectory.dir("intermediates/prefab/Release").get().asFile

            if (prefabDir.exists() && aarFile.exists()) {
                // 1. 创建临时目录解压AAR
                def tempDir = new File(buildDir, "intermediates/aar_temp")
                delete tempDir
                tempDir.mkdirs()

                // 2. 解压AAR到临时目录
                copy {
                    from zipTree(aarFile)
                    into tempDir
                }

                // 3. 将prefab目录复制到AAR内容目录
                copy {
                    from prefabDir
                    into new File(tempDir, "prefab")
                }

                // 4. 删除旧的AAR
                delete aarFile

                // 5. 重新打包AAR
                ant.zip(destfile: aarFile.absolutePath, basedir: tempDir.absolutePath)

                // 6. 清理临时目录
                delete tempDir

                println ">> Injected prefab into AAR: ${aarFile}"
            }
        }
    }
}

