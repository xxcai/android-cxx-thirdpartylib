plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'com.thirdlib.prefab'
}

conanPrefab {
    libraryName = 'thirdpartylib'
    libraryVersion = '1.0.0'
    conanfile = 'conanfile.py'
    profile = 'android.profile'
    abis = ['arm64-v8a', 'armeabi-v7a']
    minSdk = 26
    stl = 'c++_shared'

    // 场景1：Conan 注入 Prefab
    injectConanPrefab = true
}

android {
    namespace 'com.thirdlib.thirdpartylib'
    compileSdk rootProject.ext.compileSdk

    defaultConfig {
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdk
        ndkVersion rootProject.ext.ndkVersion

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-v'
                arguments "-DANDROID_STL=c++_shared"
                arguments("-DCMAKE_TOOLCHAIN_FILE=${rootProject.projectDir}/lib/conan_android_toolchain.cmake")
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    publishing {
        singleVariant("release")
    }
}

// Maven发布配置
publishing {
    publications {
        release(MavenPublication) {
            afterEvaluate {
                from components.release
            }

            groupId = 'com.thirdlib'
            artifactId = 'thirdpartylib'
            version = '1.0.0'

            pom {
                name = 'thirdpartylib'
                description = 'Android C++ Thirdparty Library with Prefab support'
                url = 'https://github.com/example/thirdpartylib'
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'developer'
                        name = 'Developer'
                        email = 'developer@example.com'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            // 本地Maven仓库路径
            url = uri("${rootDir}/local-maven-repo")
        }
    }
}
