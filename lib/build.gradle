// 存储conan包的package folder路径
ext.conanPackageFoldersMap = [:]

// 从conan graph info收集package folder路径
def collectPackageFolders(String build_type, String arch) {
    def cmd = "conan graph info . --profile android.profile " +
              "-s build_type=${build_type} -s arch=${arch} --format=json"
    println ">> collectPackageFolders: ${cmd}"

    def sout = new StringBuilder(), serr = new StringBuilder()
    def proc = cmd.execute(null, projectDir)
    proc.consumeProcessOutput(sout, serr)
    proc.waitFor()

    if (proc.exitValue() != 0) {
        throw new Exception("conan graph info failed: ${serr}")
    }

    def jsonSlurper = new groovy.json.JsonSlurper()
    def graphInfo = jsonSlurper.parseText(sout.toString())
    def nodes = graphInfo.graph.nodes

    nodes.each { id, node ->
        def packageId = node.package_id
        def recipe = node.recipe

        if (packageId && recipe != 'Cli' && recipe != 'Consumer') {
            def ref = node.ref.split('#')[0]
            def packageName = ref.split('/')[0].toLowerCase()

            // 使用conan cache path获取包路径
            def cacheCmd = "conan cache path ${ref}:${packageId}"
            def cacheSout = new StringBuilder(), cacheSerr = new StringBuilder()
            def cacheProc = cacheCmd.execute(null, projectDir)
            cacheProc.consumeProcessOutput(cacheSout, cacheSerr)
            cacheProc.waitFor()

            if (cacheProc.exitValue() == 0) {
                def packageFolder = cacheSout.toString().trim()
                conanPackageFoldersMap[packageName] = packageFolder
                println ">> Package folder for ${packageName}: ${packageFolder}"
            }
        }
    }
}

// 在conanInstall中收集package folders
// 在原始conanInstall task之后添加收集逻辑
def conanInstallTask = tasks.getByName('conanInstall')
conanInstallTask.finalizedBy tasks.register('collectPackageFoldersTask') {
    doLast {
        ["Release"].each { buildType ->
            ["arm64-v8a"].each { abi ->
                def arch = abiToConanArch[abi]
                collectPackageFolders(buildType, arch)
            }
        }
    }
}

// 生成prefab.json (Prefab Package 2 格式)
def generatePrefabJson(def buildDir) {
    def prefabJson = new File(buildDir, "prefab.json")
    // schema_version必须是2（AGP 8.x使用V2），添加version字段
    // dependencies为空数组，因为zlib等依赖已作为内部模块集成
    def version = project.hasProperty('libraryVersion') ? libraryVersion : '1.0.0'
    prefabJson.text = """
{
    "schema_version": 2,
    "name": "thirdpartylib",
    "version": "${version}",
    "dependencies": []
}
"""
    return prefabJson
}

// 删除generateModulesJson函数（Prefab 2不需要modules.json）

// 生成thirdpartylib/module.json (Prefab Module 2 格式)
def generateModuleJson(def moduleDir, String libraryName, List<String> exportLibraries) {
    def moduleJson = new File(moduleDir, "module.json")
    def exportLibrariesJson = exportLibraries ? "\"export_libraries\": ${groovy.json.JsonOutput.toJson(exportLibraries)}," : ""
    moduleJson.text = """
{
    ${exportLibrariesJson}
    "library_name": "${libraryName}"
}
"""
    return moduleJson
}

// 生成libs/android.<abi>/abi.json (Prefab ABI 2 格式)
def generateAbiJson(def libDir, String abi, int api, int ndkMajor, String stl, boolean isStatic) {
    def abiJson = new File(libDir, "abi.json")
    abiJson.text = """
{
    "abi": "${abi}",
    "api": ${api},
    "ndk": ${ndkMajor},
    "stl": "${stl}",
    "static": ${isStatic}
}
"""
    return abiJson
}

// 查找库文件
def findLibraryFile(def buildDir, String abi, String libName) {
    // 搜索所有可能的variant目录
    def searchPaths = [
        new File(buildDir, "intermediates/cmake/release/obj/${abi}"),
        new File(buildDir, "intermediates/cmake/RelWithDebInfo/obj/${abi}"),
        new File(buildDir, "intermediates/cmake/Debug/obj/${abi}"),
        new File(buildDir, "intermediates/cxx/"),
    ]

    for (def path : searchPaths) {
        if (path.exists()) {
            def result = findFileRecursively(path, libName)
            if (result) {
                return result
            }
        }
    }
    return null
}

def findFileRecursively(File dir, String fileName) {
    if (!dir.exists() || !dir.isDirectory()) return null

    def children = dir.listFiles()
    if (children == null) return null

    for (File child : children) {
        if (child.name == fileName) {
            return child
        }
        if (child.isDirectory()) {
            def result = findFileRecursively(child, fileName)
            if (result) return result
        }
    }
    return null
}

// ==================== 通用的Prefab模块生成方法 ====================

// 解析 conanfile.txt 获取依赖列表
def parseConanfileTxt(File conanfile) {
    def deps = []
    def inRequires = false
    conanfile.eachLine { line ->
        def trimmed = line.trim()
        if (trimmed.startsWith('[requires]')) {
            inRequires = true
        } else if (trimmed.startsWith('[')) {
            inRequires = false
        } else if (inRequires && trimmed) {
            def pkg = trimmed.split('/')[0]
            if (!deps.contains(pkg)) {
                deps << pkg
            }
        }
    }
    return deps
}

// 针对每个依赖生成 prefab 模块
def generatePrefabModule(String packageName, String abi, String variant, File modulesDir) {
    def packageFolder = conanPackageFoldersMap[packageName]
    if (!packageFolder) {
        println ">> Warning: ${packageName} package folder not found"
        return
    }

    def moduleDir = new File(modulesDir, packageName)
    def libsDir = new File(moduleDir, "libs/android.${abi}")

    println ">> Generating prefab module: ${packageName}"

    // 1. 复制头文件
    def includeSrc = new File(packageFolder, "include")
    if (includeSrc.exists()) {
        def includeDest = new File(moduleDir, "include")
        includeDest.mkdirs()
        copy {
            from includeSrc
            into includeDest
            include '**/*.h'
        }
        println ">>   Copied headers: ${includeSrc}"
    }

    // 2. 复制库文件 (.so 或 .a)
    def libSrc = new File(packageFolder, "lib")
    if (libSrc.exists() && libSrc.listFiles()) {
        libsDir.mkdirs()
        libSrc.eachFile { file ->
            if (file.name.endsWith('.so') || file.name.endsWith('.a')) {
                copy {
                    from file
                    into libsDir
                }
                println ">>   Copied library: ${file.name}"
            }
        }
    }

    // 3. 确定 library_name
    def libraryName = "lib${packageName}"
    if (libsDir.exists()) {
        def libFile = libsDir.listFiles().find { it.name.endsWith('.so') || it.name.endsWith('.a') }
        if (libFile) {
            libraryName = libFile.name.replaceAll(/\.(so|a)$/, '')
        }
    }
    generateModuleJson(moduleDir, libraryName, [])

    // 4. 生成 abi.json
    def minSdk = android.defaultConfig.minSdk ?: 21
    def ndkVersion = project.hasProperty('ndkVersion') ? ndkVersion : "25.1.8937393"
    def ndkMajor = ndkVersion.split('\\.')[0].toInteger()
    def stl = "c++_shared"
    def libFile = libsDir.listFiles()?.find { it.name.endsWith('.so') || it.name.endsWith('.a') }
    def isStatic = libFile?.name?.endsWith('.a') ?: false
    generateAbiJson(libsDir, abi, minSdk, ndkMajor, stl, isStatic)
    println ">>   Generated module.json and abi.json"
}

// 自定义Task: assemblePrefab
task assemblePrefab {
    group = "build"
    description = "Assemble prefab directory structure for AAR (Prefab 2 format)"

    dependsOn 'conanInstall'
    dependsOn 'collectPackageFoldersTask'
    dependsOn 'externalNativeBuildRelease'

    doLast {
        def variant = "Release"
        def abi = "arm64-v8a"

        def buildDir = layout.buildDirectory.get().asFile
        def prefabDir = new File(buildDir, "intermediates/prefab/${variant}")
        def modulesDir = new File(prefabDir, "modules")

        prefabDir.mkdirs()
        modulesDir.mkdirs()

        println ">> assemblePrefab: prefabDir=${prefabDir}"

        // ==================== thirdparty 模块 ====================
        def thirdpartyModuleDir = new File(modulesDir, "thirdpartylib")
        thirdpartyModuleDir.mkdirs()

        // 1. 复制 libthirdpartylib.so
        def thirdpartyLibSo = findLibraryFile(buildDir, abi, "libthirdpartylib.so")
        if (thirdpartyLibSo) {
            def libDir = new File(thirdpartyModuleDir, "libs/android.${abi}")
            libDir.mkdirs()
            copy {
                from thirdpartyLibSo
                into libDir
            }
            println ">> Copied libthirdpartylib.so"
        }

        // 2. 复制自己的头文件
        def ownHeadersSrc = new File(projectDir, "src/main/cpp/include")
        def ownHeadersDest = new File(thirdpartyModuleDir, "include")
        if (ownHeadersSrc.exists()) {
            ownHeadersDest.mkdirs()
            copy {
                from ownHeadersSrc
                into ownHeadersDest
                include '**/*.h'
            }
        }

        // 3. 从 conanfile.txt 读取依赖
        def conanfileTxt = new File(projectDir, "conanfile.txt")
        def dependencies = parseConanfileTxt(conanfileTxt)
        println ">> Dependencies from conanfile.txt: ${dependencies}"

        // 4. 生成 thirdparty/module.json，添加依赖
        generateModuleJson(thirdpartyModuleDir, "libthirdpartylib", dependencies.collect { ":${it}" })

        // 5. 生成 thirdparty/abi.json
        def thirdpartyLibDir = new File(thirdpartyModuleDir, "libs/android.${abi}")
        if (thirdpartyLibDir.exists()) {
            def minSdk = android.defaultConfig.minSdk ?: 21
            def ndkVersion = project.hasProperty('ndkVersion') ? ndkVersion : "25.1.8937393"
            def ndkMajor = ndkVersion.split('\\.')[0].toInteger()
            def stl = "c++_shared"
            def libFile = thirdpartyLibDir.listFiles()?.find { it.name.endsWith('.so') || it.name.endsWith('.a') }
            def isStatic = libFile?.name?.endsWith('.a') ?: false
            generateAbiJson(thirdpartyLibDir, abi, minSdk, ndkMajor, stl, isStatic)
        }

        // ==================== 为每个依赖生成 prefab 模块 ====================
        dependencies.each { packageName ->
            generatePrefabModule(packageName, abi, variant, modulesDir)
        }

        // ==================== 生成 prefab.json ====================
        generatePrefabJson(prefabDir)

        println ">> Prefab assembled at: ${prefabDir.absolutePath}"
        println ">> Prefab structure:"
        prefabDir.eachFileRecurse { file ->
            if (file.isFile()) {
                println ">>   ${file.absolutePath.replace(prefabDir.absolutePath + '/', '')}"
            }
        }
    }
}

// 拦截AAR打包，注入prefab目录
afterEvaluate {
    // AGP 8.x 使用 bundleReleaseAar 任务名，创建的是zip文件
    def packageTask = tasks.find { it.name == 'bundleReleaseAar' }
    if (packageTask) {
        packageTask.dependsOn assemblePrefab

        packageTask.doLast {
            // bundleReleaseAar 创建的是zip文件
            def aarFile = new File(buildDir, "outputs/aar/lib-release.aar")
            def prefabDir = layout.buildDirectory.dir("intermediates/prefab/Release").get().asFile

            if (prefabDir.exists() && aarFile.exists()) {
                // 1. 创建临时目录解压AAR
                def tempDir = new File(buildDir, "intermediates/aar_temp")
                delete tempDir
                tempDir.mkdirs()

                // 2. 解压AAR到临时目录
                copy {
                    from zipTree(aarFile)
                    into tempDir
                }

                // 3. 将prefab目录复制到AAR内容目录
                copy {
                    from prefabDir
                    into new File(tempDir, "prefab")
                }

                // 4. 删除旧的AAR
                delete aarFile

                // 5. 重新打包AAR
                ant.zip(destfile: aarFile.absolutePath, basedir: tempDir.absolutePath)

                // 6. 清理临时目录
                delete tempDir

                println ">> Injected prefab into AAR: ${aarFile}"
            }
        }
    }
}

// 辅助方法：使用patchelf读取库的soname
def getSoname(File soFile) {
    def cmd = "patchelf --print-soname ${soFile.absolutePath}"
    def result = cmd.execute(null, null).text.trim()
    return result
}

// 辅助方法：获取NEEDED依赖列表
def getNeededLibraries(File soFile) {
    def cmd = "patchelf --print-needed ${soFile.absolutePath}"
    def result = cmd.execute(null, null).text.trim()
    return result.readLines().collect { it.trim() }
}

// 处理单个.so文件
def patchSoFile(File soFile) {
    if (!soFile.name.endsWith(".so")) return

    def fileName = soFile.name
    println ">> Processing: ${fileName}"

    // 1. 修改SONAME
    def currentSoname = getSoname(soFile)
    if (currentSoname != fileName) {
        def cmd = "patchelf --set-soname ${fileName} ${soFile.absolutePath}"
        println ">>   SONAME: ${currentSoname} -> ${fileName}"
        cmd.execute(null, null).waitFor()
    } else {
        println ">>   SONAME matches, skipping"
    }

    // 2. 修改NEEDED依赖
    def neededLibs = getNeededLibraries(soFile)
    neededLibs.each { neededLib ->
        if (neededLib.contains(".so.")) {
            def targetLib = neededLib.replaceAll(/\.so\..+$/, '.so')
            if (neededLib != targetLib) {
                def cmd = "patchelf --replace-needed ${neededLib} ${targetLib} ${soFile.absolutePath}"
                println ">>   NEEDED: ${neededLib} -> ${targetLib}"
                cmd.execute(null, null).waitFor()
            }
        }
    }

    // 3. 验证：重新读取并打印最终结果
    def finalSoname = getSoname(soFile)
    def finalNeeded = getNeededLibraries(soFile)
    println ">>   VERIFIED: SONAME=${finalSoname}, NEEDED=${finalNeeded}"
}

